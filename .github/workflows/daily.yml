# Two runs a day, each about 5 hours after its market closes:
#   SGX run: 22:07 Singapore time, Monday to Friday (SGX closes 17:00)
#   US run:  10:07 Singapore time, Tuesday to Saturday (about 9pm New York;
#            10pm in US summer time)
# Each run collects only its own market's stocks, benchmarks and peers, re-pulls
# any price file that misses the latest session, then rebuilds the packs and the
# dashboard (the other market's figures are kept from its last run).
# It also runs (both markets) within a minute or two whenever watchlist.txt or
# peers.txt is edited. You can start it by hand: Actions tab -> "Daily stock
# data" -> Run workflow -> pick the market.

name: Daily stock data

on:
  schedule:
    # GitHub's clock is UTC (Singapore = UTC + 8). Minute 7, not 0, because runs
    # set for the top of the hour queue longest. GitHub may start a run up to an
    # hour late. If you change a line here, change it in "Pick the market" too.
    - cron: "7 14 * * 1-5"   # SGX run: 14:07 UTC = 22:07 SGT, Mon-Fri
    - cron: "7 2 * * 2-6"    # US run:  02:07 UTC = 10:07 SGT, Tue-Sat
  # Also run straight away whenever watchlist.txt or peers.txt is saved (edited) on GitHub.
  push:
    branches: [main]
    paths: [watchlist.txt, peers.txt]
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to collect"
        type: choice
        options: [both, SGX, US]
        default: both

permissions:
  contents: write   # save the data files back into the repo
  issues: write     # post the daily report notice (this is what emails you)
  pages: write      # publish the dashboard
  id-token: write   # required by GitHub Pages publishing

concurrency:
  group: daily-stock-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # includes up to 2 waits of 15 min for late bars
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Pick the market
        id: which
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ github.event.inputs.market }}
        run: |
          case "$SCHEDULE" in
            "7 14 * * 1-5") m=SGX ;;
            "7 2 * * 2-6")  m=US ;;
            *) m="${CHOSEN:-both}" ;;   # started by hand or by a watchlist edit
          esac
          echo "market=$m" >> "$GITHUB_OUTPUT"
          echo "Market for this run: $m"

      - name: Collect the data
        id: collect
        continue-on-error: true   # still save and publish whatever worked
        run: python pipeline.py --market "${{ steps.which.outputs.market }}"

      - name: Save the data files into the repo
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Daily data $(TZ=Asia/Singapore date +%F) (${{ steps.which.outputs.market }})" || echo "Nothing new to save"
          # pick up any edit you made while the job was running, then save
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
          # the saved version's ID, used for the "frozen copy" links in the email
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare the website
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4

      # Posts a comment on the issue "Daily stock data reports" after every run,
      # good or bad. The comment mentions you, so GitHub emails you (and pings
      # the GitHub mobile app if you use it) with the status and report links.
      - name: Send the report notice
        if: always()
        continue-on-error: true   # a notice problem never spoils the data run
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COLLECT: ${{ steps.collect.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          TRIGGER: ${{ github.event_name }}
          SHA: ${{ steps.save.outputs.sha }}
          REPO: ${{ github.repository }}
          MARKET: ${{ steps.which.outputs.market }}
        run: |
          python - <<'PY'
          import os, re, json, subprocess, pathlib
          from datetime import datetime, timezone, timedelta

          env = os.environ
          site = f"https://{env['OWNER'].lower()}.github.io/{env['REPO_NAME']}/"
          d = pathlib.Path("docs/data")
          status = (d / "status.txt").read_text(encoding="utf-8") if (d / "status.txt").exists() else ""
          news = (d / "news_pack.txt").read_text(encoding="utf-8") if (d / "news_pack.txt").exists() else ""

          def count(pattern, text):
              m = re.search(pattern, text)
              return int(m.group(1)) if m else None

          # This run's own result (its market only); status.txt covers both markets
          rr_path = d / "run_result.json"
          rr = json.loads(rr_path.read_text(encoding="utf-8")) if rr_path.exists() else None
          if rr:
              crit, gaps = len(rr["critical"]), len(rr["warnings"])
          else:
              crit = count(r"CRITICAL \((\d+)\)", status)
              gaps = count(r"GAPS \((\d+)\)", status)
          market = env.get("MARKET") or "both"
          label = {"SGX": "SGX run", "US": "US run"}.get(market, "SGX + US run")
          with_sum = count(r"# ITEMS WITH A SUMMARY \((\d+)\)", news)
          headlines = count(r"# HEADLINES ONLY \((\d+)\)", news)
          crit_lines = [f"- {c}" for c in rr["critical"]] if rr else []
          stale_lines = []
          if rr:
              for m, items in rr.get("stale", {}).items():
                  for x in items:
                      stale_lines.append(f"- {x['symbol']}: last bar {x['last']}, should have {x['expected']}")

          if not status:
              verdict = "FAILED - the script stopped before writing any files"
          elif crit:
              verdict = f"FAILED - {crit} critical gap(s): prices or rates missing"
          elif gaps:
              verdict = f"OK - {gaps} expected gaps (marked NOT RETRIEVED)"
          else:
              verdict = "OK - all data collected"
          verdict = f"{label}: {verdict}"
          if env.get("DEPLOY") != "success":
              verdict += ". Dashboard NOT updated (publishing step failed)"

          when = datetime.now(timezone(timedelta(hours=8))).strftime("%a %d %b %Y, %H:%M SGT")
          trigger = {"schedule": "daily schedule", "push": "watchlist edit",
                     "workflow_dispatch": "started by hand"}.get(env.get("TRIGGER"), env.get("TRIGGER"))
          lines = [
              f"@{env['OWNER']} **{verdict}**",
              f"Run finished {when} ({trigger}).",
              "",
          ]
          if crit_lines:
              lines += ["**Critical gaps**"] + crit_lines + [""]
          if stale_lines:
              lines += ["**Behind after re-pulls** (a separate STALE issue has the details)"] + stale_lines + [""]
          summary = d / "summary.md"
          if summary.exists() and status:
              lines += [summary.read_text(encoding="utf-8").strip(), ""]
          if with_sum is not None:
              lines.append(f"**News:** {with_sum} items with a summary, {headlines} headline-only.")
              lines.append("")
          lines += [
              "**Latest report** (these links always show the newest run)",
              f"- Dashboard: {site}",
              f"- For your AI (everything in one file): {site}data/ai_bundle.txt",
              f"- Data pack: {site}data/data_pack.txt",
              f"- News pack: {site}data/news_pack.txt",
              f"- Full status list: {site}data/status.txt",
              "",
          ]
          sha = env.get("SHA", "")
          day = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d")
          if sha:
              raw = f"https://raw.githubusercontent.com/{env['REPO']}/{sha}/docs/data"
              blob = f"https://github.com/{env['REPO']}/blob/{sha}/docs/data"
              lines += [
                  "**This run's copy** (frozen: these never change)",
                  f"- For your AI, this day's bundle: {raw}/ai_bundle.txt",
                  f"- Data pack to read: {blob}/data_pack.txt",
                  f"- News pack to read: {blob}/news_pack.txt",
                  f"- Dated folder: {site}data/history/{day}/data_pack.txt",
                  f"- All past days: {site}history.html",
                  "",
              ]
          lines.append(f"Run log: {env['RUN_URL']}")
          pathlib.Path("notice.md").write_text("\n".join(lines), encoding="utf-8")

          title = "Daily stock data reports"
          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout.strip()
          num = gh("issue", "list", "--state", "open", "--search", f'"{title}" in:title',
                   "--json", "number,title", "--jq", f'[.[] | select(.title == "{title}")][0].number // empty')
          if not num:
              url = gh("issue", "create", "--title", title, "--body",
                       f"@{env['OWNER']} Each run of the daily stock data job posts a comment here with its "
                       "status and links to the report. Keep this issue open; closing it starts a new one.")
              num = url.rstrip("/").split("/")[-1]
          gh("issue", "comment", num, "--body-file", "notice.md")
          print(pathlib.Path("notice.md").read_text(encoding="utf-8"))
          PY

      # Opens an issue titled like "STALE: MRVL, NVDA behind (US run)" when a
      # price file still misses its market's latest session after the re-pulls.
      # The issue mentions you, so GitHub emails you. When a later run of that
      # market is up to date, it comments and closes the issue. No issue, no email.
      - name: Send a STALE alert if files are behind
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, json, subprocess, pathlib
          env = os.environ
          p = pathlib.Path("docs/data/run_result.json")
          if not p.exists():
              raise SystemExit("No run_result.json - nothing to check")
          r = json.loads(p.read_text(encoding="utf-8"))

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout.strip()

          open_issues = json.loads(gh("issue", "list", "--state", "open", "--search", "STALE in:title",
                                      "--json", "number,title,body", "--limit", "50") or "[]")
          actions = f"https://github.com/{env['REPO']}/actions/workflows/daily.yml"
          for m in r["markets"]:
              marker = f"<!-- stale-market:{m} -->"
              mine = [i for i in open_issues if marker in (i.get("body") or "")]
              items = r["stale"].get(m, [])
              if items:
                  names = ", ".join(x["symbol"].lstrip("^") for x in items)
                  title = f"STALE: {names} behind ({m} run)"
                  rows = "\n".join(f"| {x['symbol']} | {x['last']} | {x['expected']} |" for x in items)
                  body = "\n".join([
                      f"@{env['OWNER']} The {m} run of {r['run_stamp']} still misses the latest {m} session "
                      f"for these files after {r['retries']} re-pull(s), {r['retry_wait_min']:g} minutes apart:",
                      "", "| File | Last bar | Should have |", "|---|---|---|", rows, "",
                      "The harness will mark that session as not in the data. What you can do:",
                      f"- Wait: the next {m} run re-pulls everything and closes this issue when the files catch up.",
                      f"- Or re-run now: [Actions]({actions}) -> Run workflow -> market = {m}.",
                      "- If that day was a market holiday, add it to holidays.txt (then close this issue).",
                      "", f"Run log: {env['RUN_URL']}", marker])
                  if mine:
                      num = str(mine[0]["number"])
                      gh("issue", "edit", num, "--title", title)
                      gh("issue", "comment", num, "--body", body)
                  else:
                      gh("issue", "create", "--title", title, "--body", body)
                  print("STALE alert:", title)
              else:
                  for i in mine:
                      exp = r["expected"].get(m)
                      gh("issue", "comment", str(i["number"]), "--body",
                         f"All {m} files now have the {exp} session (run of {r['run_stamp']}). Closing.")
                      gh("issue", "close", str(i["number"]))
                  print(f"{m}: no files behind")
          PY

      - name: Mark the run as failed if prices or rates are missing
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Critical gaps on this run. Details:"
          cat docs/data/status.txt || true
          exit 1
