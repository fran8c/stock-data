<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Data Desk · Past days</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1c1d1f; --muted:#6b6e73; --line:#e3e1db;
  --up:#1f7a4d; --down:#b3261e; --accent:#2d4f8a; --chip:#efede7;
  --ok-bg:#e6f3ec; --ok-ink:#1f5c3d; --warn-bg:#fff4dc; --warn-ink:#7a5200; --bad-bg:#fde8e6; --bad-ink:#8c1d18;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141517; --panel:#1d1f22; --ink:#ecebe7; --muted:#9b9ea4; --line:#2e3135;
    --up:#5cc590; --down:#f2867c; --accent:#8fb0ea; --chip:#2a2c30;
    --ok-bg:#16301f; --ok-ink:#9ad9b4; --warn-bg:#3a2d10; --warn-ink:#f3cd7b; --bad-bg:#3d1916; --bad-ink:#f6aaa3;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:16px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
a{color:var(--accent)}
.muted{color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.dates{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:2px;max-height:70vh;overflow:auto}
.dates button{font:inherit;text-align:left;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.dates button:hover{background:var(--chip)}
.dates button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.dates button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:grid;gap:12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:8px;text-decoration:none;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.state{border-radius:8px;padding:8px 12px;font-weight:600}
.state.ok{background:var(--ok-bg);color:var(--ok-ink)} .state.warn{background:var(--warn-bg);color:var(--warn-ink)} .state.bad{background:var(--bad-bg);color:var(--bad-ink)}
.sum{overflow-x:auto}
.sum table{border-collapse:collapse;font-size:14px;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.sum th,.sum td{padding:5px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.sum th:first-child,.sum td:first-child,.sum td:nth-child(3){text-align:left}
.sum th{border-top:0;color:var(--muted);font-weight:600;font-size:12px}
.sum p{margin:6px 0}
.up{color:var(--up)} .down{color:var(--down)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Past days</h1>
    <a href="./">← Back to today's dashboard</a>
  </header>
  <div class="layout">
    <nav class="dates" id="dates" aria-label="Dates"><span class="muted" style="padding:8px">Loading…</span></nav>
    <main class="panel" id="day"><p class="muted">Pick a date.</p></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\\\*/g,"*")
    .replace(/([+-]\d+(?:\.\d+)?%)/g,m=>`<span class="${m[0]==="+"?"up":"down"}">${m}</span>`);
}
// Small reader for the summary file: bold text, paragraphs and pipe tables only.
function md(text){
  const out=[];const lines=text.split("\n");
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(l.startsWith("|")){
      const rows=[];while(i<lines.length&&lines[i].startsWith("|")){rows.push(lines[i]);i++}i--;
      const cells=r=>r.slice(1,-1).split("|").map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(2).map(cells);
      out.push(`<table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    }else if(l.trim()){out.push(`<p>${inline(l)}</p>`)}
  }
  return out.join("");
}
async function show(date){
  document.querySelectorAll("#dates button").forEach(b=>b.setAttribute("aria-current",b.dataset.d===date));
  const base=`data/history/${date}/`;
  const panel=$("#day");
  panel.innerHTML=`<p class="muted">Loading ${esc(date)}…</p>`;
  let status="",summary="";
  try{status=await (await fetch(base+"status.txt",{cache:"no-store"})).text()}catch{}
  try{const r=await fetch(base+"summary.md",{cache:"no-store"});if(r.ok)summary=await r.text()}catch{}
  const first=(status.split("\n")[0]||"").replace("RUN STATUS: ","");
  const cls=/FAILED/.test(first)?"bad":/gaps/.test(first)?"warn":"ok";
  const abs=p=>new URL(base+p,location.href).href;
  panel.innerHTML=`<h2 style="margin:0;font-size:20px">${esc(date)}</h2>
    <div class="state ${cls}">${esc(first||"No status file for this day")}</div>
    <div class="links">
      <a class="btn" href="${base}data_pack.txt" target="_blank" rel="noopener">Data pack</a>
      <a class="btn" href="${base}news_pack.txt" target="_blank" rel="noopener">News pack</a>
      <a class="btn" href="${base}status.txt" target="_blank" rel="noopener">Status</a>
      <button class="btn" data-copy="${esc(abs("data_pack.txt"))}">Copy data pack link</button>
      <button class="btn" data-copy="${esc(abs("news_pack.txt"))}">Copy news pack link</button>
    </div>
    <div class="sum">${summary?md(summary):'<p class="muted">No market summary was saved for this day.</p>'}</div>`;
  panel.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(b.dataset.copy);toast("Link copied")}catch{toast(b.dataset.copy)}
  }));
  if(location.hash!=="#"+date)history.replaceState(null,"","#"+date);
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
fetch("data/history/index.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  const dates=j.dates||[];
  if(!dates.length)throw 0;
  $("#dates").innerHTML=dates.map(d=>{const w=new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"});return `<button data-d="${d}"><span>${d}</span><span class="muted">${w}</span></button>`}).join("");
  document.querySelectorAll("#dates button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.d)));
  const want=location.hash.slice(1);
  show(dates.includes(want)?want:dates[0]);
}).catch(()=>{
  $("#dates").innerHTML='<span class="muted" style="padding:8px">No past days saved yet.</span>';
  $("#day").innerHTML='<p class="muted">The first dated copy appears after the next run.</p>';
});
</script>
</body>
</html>
